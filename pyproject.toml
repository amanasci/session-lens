[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-session-lens"
version = "0.1.0"
description = "A local Codex session viewer with event timelines, flags, and review notes"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["codex", "sessions", "developer-tools", "review"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
session-lens = "session_lens.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
session_lens = ["static/*.html", "static/*.css", "static/*.js", "examples/*.jsonl"]
